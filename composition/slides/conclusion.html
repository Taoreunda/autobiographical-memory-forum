      ><span class="packet" id="text-packet-1"></span
      ><span class="packet" id="text-packet-2"></span
      ><span class="packet" id="text-packet-3"></span
      ><p id="conclusion-message"
        >자서전적 기억 면담을 통한 우울 증상 분류의 가능성</p
      ></section
    ></div
  ><script>
    const tl = gsap.timeline({ paused: true });
    function appear(id, t, d = 0.5) {
      tl.fromTo(id, { opacity: 0 }, { opacity: 1, duration: d }, t);
    }
    function draw(id, t, d = 0.7) {
      const p = document.querySelector(id),
        len = p.getTotalLength();
      tl.fromTo(
        p,
        { opacity: 0, strokeDasharray: len, strokeDashoffset: len },
        { opacity: 1, strokeDashoffset: 0, duration: d, ease: 'none' },
        t,
      );
    }
    function pathPacket(selector, pathId, start, duration) {
      const path = document.querySelector(pathId),
        length = path.getTotalLength();
      const points = Array.from({ length: 45 }, (_, i) => {
        const p = path.getPointAtLength((length * i) / 44);
        return {
          x: p.x - 7,
          y: p.y - 7,
          duration: duration / 44,
          ease: 'none',
        };
      });
      tl.set(selector, { x: points[0].x, y: points[0].y }, start);
      appear(selector, start, 0.12);
      tl.to(selector, { keyframes: points.slice(1), ease: 'none' }, start);
      tl.to(selector, { opacity: 0, duration: 0.15 }, start + duration - 0.1);
    }
    appear('#participant', 0.1);
    appear('#ai-avatar', 0.1);
    appear('.actor-caption', 0.3);
    // Read geometry from the actual elements so CSS and motion cannot drift apart.
    const bounds = (id) => {
      const element = document.getElementById(id);
      return {
        left: element.offsetLeft,
        top: element.offsetTop,
        width: element.offsetWidth,
        height: element.offsetHeight,
      };
    };
    const merged = bounds('merged-dialogue');
    const turns = ['ai-cue', 'person-answer', 'ai-response', 'person-detail'];
    turns.forEach((id, i) =>
      tl.fromTo(
        '#' + id,
        { opacity: 0, x: i % 2 ? -16 : 16 },
        { opacity: 1, x: 0, duration: 0.55, ease: 'power2.out' },
        0.7 + i * 3,
      ),
    );
    [3.7, 9.7].forEach((t) =>
      tl.fromTo(
        '#speaking-wave',
        { opacity: 0 },
        { opacity: 1, duration: 0.3, repeat: 7, yoyo: true },
        t,
      ),
    );
    [0.7, 6.7].forEach((t) =>
      tl.fromTo(
        '#ai-face',
        { opacity: 0.65 },
        { opacity: 1, duration: 0.4, repeat: 5, yoyo: true },
        t,
      ),
    );
    // The four bubbles converge on the center of the conversation — never on the AI.
    turns.forEach((id, i) => {
      const { left, top, width, height } = bounds(id);
      const t = 14 + i * 0.08;
      tl.to('#' + id + ' .bubble-copy', { opacity: 0, duration: 0.35 }, t);
      tl.to(
        '#' + id,
        {
          x: merged.left - left,
          y: merged.top - top,
          scaleX: merged.width / width,
          scaleY: merged.height / height,
          transformOrigin: '0 0',
          duration: 1.35,
          ease: 'power2.inOut',
        },
        t,
      );
      tl.to('#' + id, { opacity: 0, duration: 0.3 }, 15.45);
    });
    appear('#merged-dialogue', 15.3, 0.45);
    // Pause on the merged speech bubble, then let three representations unfold from it.
    tl.to('#participant, #person-caption', { opacity: 0, duration: 0.55 }, 17);
    tl.to('#merged-dialogue', { opacity: 0, duration: 0.65 }, 17.7);
    ['memory', 'voice', 'text'].forEach((key, i) => {
      const card = bounds(key + '-card');
      tl.fromTo(
        '#' + key + '-card',
        {
          x: merged.left - card.left,
          y: merged.top - card.top,
          scaleX: merged.width / card.width,
          scaleY: merged.height / card.height,
        },
        {
          x: 0,
          y: 0,
          scaleX: 1,
          scaleY: 1,
          transformOrigin: '0 0',
          duration: 1.5,
          ease: 'power2.inOut',
        },
        17.4 + i * 0.13,
      );
      appear('#' + key + '-card', 17.4 + i * 0.13, 0.3);
      appear('#' + key + '-card .feature-icon', 18.7 + i * 0.13, 0.4);
      appear('#' + key + '-card .feature-copy', 18.7 + i * 0.13, 0.4);
      tl.to(
        '#' + key + '-content',
        { opacity: 0, y: -8, duration: 0.45 },
        21.6 + i * 0.15,
      );
      appear('#' + key + '-vector', 22 + i * 0.15, 0.4);
      tl.fromTo(
        '#' + key + '-vector .datum',
        { scaleY: 0 },
        {
          scaleY: 1,
          duration: 0.4,
          stagger: 0.04,
          transformOrigin: '50% 100%',
        },
        22 + i * 0.15,
      );
      draw('#' + key + '-link', 23.2 + i * 0.15, 0.8);
      for (let j = 0; j < 4; j++)
        pathPacket(
          '#' + key + '-packet-' + j,
          '#' + key + '-link',
          24.5 + j * 0.55 + i * 0.12,
          1.55,
        );
    });
    // The AI remains separate during the merge/split, then becomes the processing model.
    tl.to('#ai-caption', { opacity: 0, duration: 0.35 }, 19.2);
    const avatar = bounds('ai-avatar'),
      model = bounds('model-box');
    tl.to(
      '#ai-avatar',
      {
        x: model.left - avatar.left,
        y: model.top - avatar.top,
        scaleX: model.width / avatar.width,
        scaleY: model.height / avatar.height,
        transformOrigin: '0 0',
        duration: 1.15,
        ease: 'power2.inOut',
      },
      19.2,
    );
    tl.to('#ai-face', { opacity: 0, duration: 0.45 }, 20.05);
    tl.to('#ai-avatar', { opacity: 0, duration: 0.45 }, 20.3);
    appear('#model-box', 20.3, 0.45);
    document.querySelectorAll('.voice-bar').forEach((bar, i) => {
      const x = Number(bar.getAttribute('x')) + 3;
      tl.fromTo(
        bar,
        { scaleY: 0.3, svgOrigin: x + ' 21' },
        { scaleY: 1, duration: 0.28, repeat: 5, yoyo: true },
        19.2 + i * 0.015,
      );
    });
    tl.to(
      '.model-cell',
      {
        backgroundColor: '#075ddd',
        duration: 0.22,
        stagger: 0.09,
        repeat: 5,
        yoyo: true,
      },
      25.2,
    );
    ['low', 'high'].forEach((key, i) => {
      const t = 28.3 + i * 1.7;
      draw('#' + key + '-link', t, 0.7);
      appear('#result-' + key, t + 0.55, 0.55);
    });
    tl.fromTo(
      '#conclusion-message',
      { opacity: 0, y: 12 },
      { opacity: 1, y: 0, duration: 0.65 },
      33.4,
    );
    window.__timelines.conclusion = tl;
  </script></template
