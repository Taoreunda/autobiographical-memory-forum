  <script>
    const xai = gsap.timeline({ paused: true });
    function reveal(id, t) {
      xai.fromTo(
        id,
        { opacity: 0, y: 12 },
        { opacity: 1, y: 0, duration: 0.4, ease: 'power2.out' },
        t,
      );
    }
    function draw(id, t, d) {
      const path = document.querySelector(id),
        length = path.getTotalLength();
      xai.fromTo(
        path,
        { opacity: 0, strokeDasharray: length, strokeDashoffset: length },
        { opacity: 1, strokeDashoffset: 0, duration: d, ease: 'none' },
        t,
      );
    }
    reveal('#xai-importance', 0.1);
    xai.fromTo(
      '.xai-bar',
      { '--hf-grow': 0 },
      { '--hf-grow': 1, duration: 0.65, stagger: 0.1, ease: 'power2.out' },
      0.65,
    );
    // Reorder labels and bars together; these are illustrative A/B/C features, not findings.
    xai.to(
      '#xai-rank-a',
      { y: 240, duration: 0.55, ease: 'power2.inOut' },
      1.7,
    );
    xai.to(
      '#xai-rank-b,#xai-rank-c',
      { y: -120, duration: 0.55, ease: 'power2.inOut' },
      1.7,
    );
    reveal('#xai-shap', 2.55);
    // Keep each dot 28px behind its arrow tip, with a white halo separating it from the shaft.
    for (const [id, offset, distance] of [

      ['a', 0.7, 82],

        3.15 + offset,
      );
