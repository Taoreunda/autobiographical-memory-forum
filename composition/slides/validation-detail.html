  <script>
    const crossvalidation = gsap.timeline({ paused: true });
    const tl = crossvalidation;
    function enter(id, t, d = 0.45) {
      tl.fromTo(
        id,
        { opacity: 0, y: 10 },
        { opacity: 1, y: 0, duration: d, ease: 'power2.out' },
        t,
      );
    }
    function draw(id, t, d = 0.5) {
      const p = document.querySelector(id),
        len = p.getTotalLength();
      tl.fromTo(
        p,
        { opacity: 0, strokeDasharray: len, strokeDashoffset: len },
        { opacity: 1, strokeDashoffset: 0, duration: d, ease: 'none' },
        t,
      );
    }
    // Holds follow the last visible tween; no invisible playback tail between steps.
    // Local holds: .6, 2.75, 7.6, 13.35, 15.95, 19.2 (slides.json).
    // One joined block becomes two persistent datasets. People and records stay grouped.
    tl.set('#split-train', { x: 68 });
    tl.set('#split-test', { x: -68 });
    enter('#whole-label,#whole-outline,#split-train,#split-test', 0.1);
    tl.to('#whole-label,#whole-outline', { opacity: 0, duration: 0.3 }, 0.85);
    tl.to(
      '#split-train,#split-test',
      {
        x: 0,
        borderRadius: 16,
        borderColor: '#b2c5df',
        duration: 1.2,
        ease: 'power2.inOut',
      },
      0.95,
    );
    enter('#train-label,#test-label', 2.25);
    // Move the existing train people into the first fold row, then show all five rounds.
    enter('#cv-panel', 3.0);
    document
      .querySelectorAll('#train-subjects .subject')
      .forEach((person, i) => {
        const left = 40 + (i % 8) * 136,
          top = 130 + Math.floor(i / 8) * 190;
        const targetX = 204.8 + (i % 5) * 205.6;
        tl.to(
          person,
          {
            x: targetX - 50 - left,
            y: 137 - 55 - top,
            scale: 0.28,
            duration: 1.25,
            ease: 'power2.inOut',
          },
          3.25 + i * 0.02,
        );
        tl.to(person, { opacity: 0, duration: 0.25 }, 4.75 + i * 0.02);
      });
    for (let i = 1; i <= 5; i++) {
      const at = 4.45 + (i - 1) * 0.65;
      enter('#cv-row-' + i, at, 0.5);
      tl.fromTo(
        '#cv-row-' + i + ' .validation',
        { scale: 0.92 },
        { scale: 1, duration: 0.35, ease: 'power2.out' },
        at + 0.15,
      );
    }
    // Tune within train only; the held-out test people and box do not move.
    enter('#tuning-state', 7.85);
    for (const [j, at] of [
      [0, 8.5],
      [1, 9.85],
      [2, 11.2],
    ]) {
      tl.to(
        '#tune-knob-1',
        { x: [30, 8, 20][j], duration: 0.45, ease: 'power2.inOut' },
        at,
      );
      tl.to(
        '#tune-knob-2',
        { x: [-26, -4, -16][j], duration: 0.45, ease: 'power2.inOut' },
        at,
      );
      tl.to(
        '#tune-knob-3',
        { x: [22, -15, 8][j], duration: 0.45, ease: 'power2.inOut' },
        at,
      );
      tl.to(
        '.validation',
        { backgroundColor: '#4389ee', duration: 0.22, stagger: 0.06 },
        at + 0.2,
      );
      tl.to(
        '.validation',
        { backgroundColor: '#075ddd', duration: 0.22, stagger: 0.06 },
        at + 0.7,
      );
    }
    tl.to('#tuning-state', { opacity: 0, duration: 0.25 }, 12.5);
    enter('#selected-setting', 12.85);
    // Refit in the same train box, then connect the trained model to the same test box.
    tl.to('#cv-panel', { opacity: 0, duration: 0.45 }, 13.6);
    tl.to(
      '#selected-setting',
      { y: -376, duration: 0.75, ease: 'power2.inOut' },
      13.8,
    );
    draw('#refit-line', 14.6, 0.5);
    tl.fromTo(
      '#split-train',
      { borderColor: '#075ddd' },
      { borderColor: '#b2c5df', duration: 0.8, immediateRender: false },
      14.7,
    );
    enter('#model-card', 15.3, 0.6);
    draw('#test-line', 16.2, 1.1);
    tl.set('#test-pulse', { opacity: 0 }, 0);
    tl.fromTo(
      '#test-pulse',
      { x: 980, y: 670, opacity: 1 },
      {
        x: 1396,
        y: 670,
        opacity: 1,
        duration: 1.1,
        ease: 'none',
        immediateRender: false,
      },
      16.2,
    );
    tl.to('#test-pulse', { opacity: 0, duration: 0.12 }, 17.3);
    tl.to('#split-test', { borderColor: '#075ddd', duration: 0.4 }, 17.3);
    tl.to(
      '#test-subjects .subject',
      {
        borderColor: '#075ddd',
        color: '#075ddd',
        duration: 0.4,
        stagger: 0.15,
      },
      17.5,
    );
    enter('#test-status', 18.7);
    window.__timelines.crossvalidation = crossvalidation;
  </script>
