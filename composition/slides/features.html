  <script>
    const features = gsap.timeline({ paused: true });
    // All three rows advance together at a constant 400 canvas pixels/second.
    const speed = 400;
    function draw(id, time) {
      const e = document.querySelector(id),
        length = e.getTotalLength();
      features.fromTo(
        e,
        { opacity: 0, strokeDasharray: length, strokeDashoffset: length },
        {
          opacity: 1,
          strokeDashoffset: 0,
          duration: length / speed,
          ease: 'none',
        },
        time,
      );
    }
    for (const name of ['memory', 'voice', 'text']) {
      const id = '#features-' + name;
      features.fromTo(id, { opacity: 0 }, { opacity: 1, duration: 0.3 }, 0.1);
      features.fromTo(
        id + ' .feature-heading',
        { opacity: 0, x: -12 },
        { opacity: 1, x: 0, duration: 0.35, ease: 'none' },
        0.1,
      );
      draw(id + '-line', 0.55);
      document.querySelectorAll(id + ' .feature-item').forEach((item, i) => {
        const arrival = 0.55 + (80 + i * 280) / speed;
        features.fromTo(
          item,
          { opacity: 0, x: -8 },
          { opacity: 1, x: 0, duration: 0.3, ease: 'none' },
          arrival,
        );
      });
      draw(id + '-out', 0.55 + 850 / speed);
    }
    draw('#features-join-top', 2.9);
    draw('#features-join-bottom', 2.9);
    draw('#features-join-end', 3.475);
    features.fromTo(
      '#features-total',
      { opacity: 0, scale: 0.94 },
      { opacity: 1, scale: 1, duration: 0.5, ease: 'power2.out' },
      3.7,
    );
    window.__timelines.features = features;
