  <script>
    const workflow = gsap.timeline({ paused: true });
    function show(id, t) {
      workflow.fromTo(
        id,
        { opacity: 0, y: 10 },
        { opacity: 1, y: 0, duration: 0.4, ease: 'power2.out' },
        t,
      );
    }
    function line(id, t, d = 0.4) {
      const p = document.querySelector(id),
        len = p.getTotalLength();
      workflow.fromTo(
        p,
        { opacity: 0, strokeDasharray: len, strokeDashoffset: len },
        { opacity: 1, strokeDashoffset: 0, duration: d, ease: 'none' },
        t,
      );
    }
    show('#wf-eda', 0.1);
    line('#wf-line-1', 0.65);
    show('#wf-select', 0.95);
    line('#wf-line-2', 1.45);
    show('#wf-tune', 1.75);
    line('#wf-line-3', 2.25);
    show('#wf-cv', 2.55);

    // Reveal above CV, hide during review, then reveal above final fitting and stay.
    workflow.set('#wf-models', { x: 0, y: 10, opacity: 0 }, 0);
    workflow.to(
      '#wf-models',
      { opacity: 1, y: 0, duration: 0.35, ease: 'power2.out' },
      2.65,
    );
    workflow.to(
      '#wf-models',
      { opacity: 0, y: -8, duration: 0.3, ease: 'power2.in' },
      4.05,
    );
    workflow.set('#wf-models', { x: 288, y: 10 }, 7.65);
    workflow.to(
      '#wf-models',
      { opacity: 1, y: 0, duration: 0.35, ease: 'power2.out' },
      7.7,
    );
    // The same three algorithms are used for CV and final fitting.
    function activateModels(start, stage) {
      workflow.to(stage, { borderColor: '#075ddd', duration: 0.08 }, start);
      document.querySelectorAll('#wf-models span').forEach((model, i) => {
        const t = start + i * 0.25;
        workflow.to(
          model,
          {
            backgroundColor: '#075ddd',
            borderColor: '#075ddd',
            color: '#fff',
            y: 3,
            scale: 0.97,
            boxShadow: '0 0px 0 #d6dfeb',
            duration: 0.06,
            ease: 'power2.in',
          },
          t,
        );
        workflow.to(
          model,
          {
            y: 0,
            scale: 1,
            boxShadow: '0 3px 0 #0447ab',
            duration: 0.08,
            ease: 'power2.out',
          },
          t + 0.06,
        );
        workflow.to(
          model,
          {
            backgroundColor: '#fff',
            borderColor: '#b5c3d4',
            color: '#263443',
            boxShadow: '0 3px 0 #d6dfeb',
            duration: 0.08,
            ease: 'power2.out',
          },
          t + 0.16,
        );
      });
      workflow.to(
        stage,
        { borderColor: '#b5c3d4', duration: 0.1 },
        start + 0.74,
      );
    }
    activateModels(3.1, '#wf-cv');
    activateModels(8.2, '#wf-refit');
    // The inner loop adjusts parameters; the outer loop revisits data/features.
    function travel(pathId, pulseId, t, d) {
      const path = document.querySelector(pathId),
        pulse = document.querySelector(pulseId);
      const length = path.getTotalLength(),
        start = path.getPointAtLength(0);
      workflow.set(pulse, { opacity: 0 }, 0);
      workflow.set(pulse, { x: start.x, y: start.y, opacity: 1 }, t);
      for (let i = 1; i <= 60; i++) {
        const point = path.getPointAtLength((length * i) / 60);
        workflow.to(
          pulse,
          { x: point.x, y: point.y, duration: d / 60, ease: 'none' },
          t + ((i - 1) * d) / 60,
        );
      }
      workflow.to(pulse, { opacity: 0, duration: 0.12 }, t + d);
    }
    line('#wf-loop', 4.1, 1.0);
    show('#wf-loop-label', 4.1);
    travel('#wf-loop', '#wf-pulse', 4.1, 1.0);
    workflow.fromTo(
      '#wf-tune',
      { borderColor: '#075ddd' },
      { borderColor: '#b5c3d4', duration: 0.3, immediateRender: false },
      5.1,
    );
    workflow.fromTo(
      '#wf-review',
      { opacity: 0 },
      { opacity: 1, duration: 0.3 },
      5.4,
    );
    show('#wf-review-label', 5.4);
    travel('#wf-review-path', '#wf-review-pulse', 5.45, 1.4);
    travel('#wf-feature-return', '#wf-feature-pulse', 6.45, 0.4);
    workflow.fromTo(
      '#wf-eda, #wf-select',
      { borderColor: '#536279' },
      { borderColor: '#b5c3d4', duration: 0.3, immediateRender: false },
      6.85,
    );
    line('#wf-line-4', 7.25, 0.4);
    show('#wf-refit', 7.65);
    line('#wf-line-5', 9.3);
    show('#wf-test', 9.7);
    window.__timelines.workflow = workflow;
  </script>
